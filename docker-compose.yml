services:
  # ----------------------------------------------------------------------------
  # 1. ChatBot Gallery Main Web Application
  # ----------------------------------------------------------------------------
  chatbotgallery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbotgallery-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Domain & Host headers (Supports custom domains or * for reverse proxies)
      - DOMAIN=${DOMAIN:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # SQLite database persistence in /app/data volume or Turso Cloud URL
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/local.db}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      # Automatically populates sample bots if database is fresh
      - AUTO_SEED=${AUTO_SEED:-true}
    volumes:
      - gallery_data:/app/data
    networks:
      - gallery_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Companion Mock Webhook Server (Optional: for instant offline bot testing)
  # ----------------------------------------------------------------------------
  mock-bot-server:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: chatbotgallery-mock-server
    restart: unless-stopped
    ports:
      - "${MOCK_SERVER_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    networks:
      - gallery_net

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks for Portainer
# ------------------------------------------------------------------------------
volumes:
  gallery_data:
    name: chatbotgallery_data

networks:
  gallery_net:
    name: chatbotgallery_net
